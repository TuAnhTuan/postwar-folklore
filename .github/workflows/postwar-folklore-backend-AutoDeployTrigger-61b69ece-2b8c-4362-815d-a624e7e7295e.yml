name: Trigger auto deployment for postwar-folklore-backend

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/postwar-folklore-backend-AutoDeployTrigger-61b69ece-2b8c-4362-815d-a624e7e7295e.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      # Tạo image name lowercase đúng format ghcr.io/owner/repo:sha
      - name: Set image name
        id: image
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "sha=ghcr.io/$OWNER/postwar-folklore-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest=ghcr.io/$OWNER/postwar-folklore-backend:latest" >> $GITHUB_OUTPUT

      # Login GHCR để push image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bắt buộc để cache GHA hoạt động
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build và push image từ backend/
      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Login Azure bằng client secret (phù hợp Azure for Students)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy image vừa build lên Azure Container Apps
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: postwar-folklore-backend
          resourceGroup: VirtualMachine
          imageToDeploy: ${{ steps.image.outputs.sha }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
