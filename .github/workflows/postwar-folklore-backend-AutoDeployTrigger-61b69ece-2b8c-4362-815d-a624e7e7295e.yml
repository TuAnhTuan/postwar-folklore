name: Trigger auto deployment for postwar-folklore-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/postwar-folklore-backend-AutoDeployTrigger-61b69ece-2b8c-4362-815d-a624e7e7295e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POSTWARFOLKLOREBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.POSTWARFOLKLOREBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.POSTWARFOLKLOREBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.POSTWARFOLKLOREBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.POSTWARFOLKLOREBACKEND_REGISTRY_PASSWORD }}
          containerAppName: postwar-folklore-backend
          resourceGroup: VirtualMachine
          imageToBuild: ghcr.io/postwar-folklore-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


