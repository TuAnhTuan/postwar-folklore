name: postwar-folklore

# ─────────────────────────────────────────────────────────
# CÁCH CHẠY (bắt buộc dùng --env-file để load secret):
#   docker compose --env-file .env.docker up -d --build
#
# File .env.docker chứa toàn bộ credentials — đã có trong .gitignore.
# ─────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────
  # POSTGRESQL DATABASE
  # ─────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: pwf-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB:       ${POSTGRES_DB:-postwarfolklore}
  #     POSTGRES_USER:     ${POSTGRES_USER:-literature}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwd@12345}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5433:5432"   # 5432 local bị chiếm → expose ra ngoài qua 5433          # expose ra ngoài để dùng pgAdmin / DBeaver local
  #   networks:
  #     - pwf-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-literature} -d ${POSTGRES_DB:-postwarfolklore}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # ─────────────────────────────────────────
  # SPRING BOOT BACKEND
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwf-backend
    restart: unless-stopped
    environment:
      # Database — trỏ tới external DB (Render PostgreSQL hoặc local)
      DATABASE_URL:      ${DATABASE_URL:-jdbc:postgresql://localhost:5432/postwarfolklore}
      DATABASE_USERNAME: ${POSTGRES_USER:-literature}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pwd@12345}

      # Firebase
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # AI
      GROQ_API_KEY:   ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Setup
      SETUP_SECRET: ${SETUP_SECRET:-CHANGE_ME_BEFORE_USE}

      # CORS — cho phép frontend container gọi vào
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:80,http://frontend,https://cross-florist-prototype.ngrok-free.dev"

      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      PORT: 8080

    ports:
      - "8080:8080"           # expose để test API trực tiếp (Postman, curl)
    networks:
      - pwf-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/api/posts?page=0&size=1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s       # Spring Boot cần ~30-60s để khởi động
    # Mount firebase credentials file nếu dùng file thay vì JSON string
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-/dev/null}:/app/firebase-service-account.json:ro

  # ─────────────────────────────────────────
  # VUE.JS FRONTEND (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Biến VITE_ được bake vào lúc build → phải truyền qua ARG
        VITE_API_BASE_URL:                  /api
        VITE_FIREBASE_API_KEY:              ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN:          ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID:           ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET:       ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID:  ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID:               ${VITE_FIREBASE_APP_ID:-}
        VITE_CLOUDINARY_CLOUD_NAME:         ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET:      ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: pwf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"             # truy cập web tại http://localhost:3000
    networks:
      - pwf-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q '<!DOCTYPE html>' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────
volumes: {}

# ─────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────
networks:
  pwf-network:
    name: pwf-network
    driver: bridge
