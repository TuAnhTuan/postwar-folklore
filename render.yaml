## render.yaml — Cấu hình deploy tự động lên Render
## Docs: https://render.com/docs/yaml-spec

services:
  # ── 1. SPRING BOOT BACKEND (Web Service) ──
  - type: web
    name: postwar-folklore-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/postwar-folklore-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/posts?page=0&size=1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      # Database (tự động được set bởi Render khi link database)
      - key: DATABASE_URL
        fromDatabase:
          name: postwar-folklore-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: postwar-folklore-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: postwar-folklore-db
          property: password
      # Các key bên dưới phải set thủ công trong Render Dashboard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false   # Set trong Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # VD: https://postwar-folklore-frontend.onrender.com

  # ── 2. VUE.JS FRONTEND (Static Site) ──
  - type: web
    name: postwar-folklore-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — Vue Router dùng history mode
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # VD: https://postwar-folklore-backend.onrender.com/api
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

# ── 3. POSTGRESQL DATABASE ──
databases:
  - name: postwar-folklore-db
    plan: free
    databaseName: postwarfolklore
    user: pwf_user
    # LƯU Ý: Render Free PostgreSQL tự xóa sau 90 ngày — backup trước khi demo!
