spring:
  application:
    name: postwar-folklore

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/truyenthuyet}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      connection-timeout: 30000
      initialization-fail-timeout: 0   # Cho phép app start kể cả khi DB chưa sẵn sàng

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true   # Delay DB init sau khi context load xong
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime → ISO string thay vì array

server:
  port: ${PORT:8080}

# ── FIREBASE ──
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}   # path đến file JSON (local dev)
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}   # JSON string (Render env var)

# ── CLOUDINARY ──
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ── AI ──
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

# ── APP ──
app:
  setup-secret: ${SETUP_SECRET:CHANGE_ME_BEFORE_USE}

# ── RATE LIMITING ──
rate-limit:
  chat:
    capacity: 10          # max requests
    refill-tokens: 10
    refill-duration: 3600 # giây (1 giờ)

# ── CORS ──
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ── LOGGING ──
logging:
  level:
    com.postwarfolklore: DEBUG
    org.springframework.security: INFO
