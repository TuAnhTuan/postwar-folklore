spring:
  application:
    name: postwar-folklore

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  main:
    lazy-initialization: true   # Defer bean creation → app bind port trước, kết nối DB sau

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/truyenthuyet}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      connection-timeout: 30000
      initialization-fail-timeout: 0   # Cho phép app start kể cả khi DB chưa sẵn sàng

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

  sql:
    init:
      mode: always                            # Chạy schema.sql mỗi lần start
      continue-on-error: true                 # Không crash nếu DB chưa sẵn sàng

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime → ISO string thay vì array

server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 10MB

# ── FIREBASE ──
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}   # path đến file JSON (local dev)
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}   # JSON string (Render env var)

# ── CLOUDINARY ──
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ── AI ──
ai:
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    endpoint: https://api.groq.com/openai/v1/chat/completions
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash-lite
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

# ── APP ──
app:
  setup-secret: ${SETUP_SECRET:CHANGE_ME_BEFORE_USE}

# ── RATE LIMITING ──
rate-limit:
  chat:
    capacity: 10          # max requests
    refill-tokens: 10
    refill-duration: 3600 # giây (1 giờ)

# ── CORS ──
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ── LOGGING ──
logging:
  level:
    com.postwarfolklore: DEBUG
    org.springframework.security: INFO
